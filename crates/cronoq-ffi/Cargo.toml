[package]
name = "cronoq-ffi"
description = "C API for embedding the cronoq scheduler in Go, Swift and other languages (experimental)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
# Delivered as prebuilt libraries with a header, not as a crate.
publish = false

[lib]
name = "cronoq_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Recurring schedules (`cronoq_schedule_add`). Without it no schedule can be added.
default = ["cron"]
cron = ["cronoq/cron"]
# Time-zone data, for schedules in a time zone other than UTC. About twice the size.
tz = ["cron", "cronoq/tz"]
# A durable store in a SQLite file chosen by the host (`"store": {"sqlite": "<path>"}`).
sqlite = ["dep:cronoq-store-sqlite"]

[dependencies]
cronoq = { path = "../cronoq", version = "0.3.0", default-features = false }
cronoq-core.workspace = true
cronoq-store-sqlite = { path = "../cronoq-store-sqlite", version = "0.3.0", optional = true }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time"] }
