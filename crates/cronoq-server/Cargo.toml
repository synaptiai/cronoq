[package]
name = "cronoq-server"
description = "gRPC/HTTP server for the cronoq scheduler with remote workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cronoq-server"
path = "src/main.rs"

[dependencies]
cronoq = { path = "../cronoq", version = "0.1.0" }
cronoq-proto = { path = "../cronoq-proto", version = "0.1.0" }
cronoq-store-postgres = { path = "../cronoq-store-postgres", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustc-hash.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
