[package]
name = "cronoq-server"
description = "gRPC/HTTP server for the cronoq scheduler with remote workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cronoq-server"
readme = "README.md"
keywords = ["scheduler", "task-queue", "grpc", "worker", "autoscaling"]
categories = ["network-programming", "web-programming::http-server", "concurrency"]

[[bin]]
name = "cronoq-server"
path = "src/main.rs"

[dependencies]
cronoq = { path = "../cronoq", version = "0.2.0" }
cronoq-proto = { path = "../cronoq-proto", version = "0.2.0" }
cronoq-store-postgres = { path = "../cronoq-store-postgres", version = "0.2.0" }
cronoq-store-sqlite = { path = "../cronoq-store-sqlite", version = "0.2.0" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "service"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustc-hash.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
toml = "1.1"
tower = { version = "0.5", features = ["limit", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tonic-web = "0.14"
tower-http = { version = "0.7", features = ["cors"] }

[dev-dependencies]
prost = "0.14"
rcgen = "0.14"
tempfile = "3"
