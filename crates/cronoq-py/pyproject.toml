[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "cronoq"
description = "Elastic, priority-aware task scheduler with a Rust core and asyncio bindings"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Daniel Bentes", email = "daniel.bentes@synapti.ai" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Framework :: AsyncIO",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.maturin]
python-source = "python"
module-name = "cronoq._cronoq"
features = ["extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["python/tests"]
