[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cronoq"
description = "Elastic, priority-aware task scheduler for asyncio: priorities with aging, deadlines, cron, DAGs, rate limits and autoscaling, powered by Rust"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Daniel Bentes", email = "daniel.bentes@synapti.ai" }]
keywords = ["scheduler", "task-queue", "asyncio", "priority", "rate-limit", "cron", "autoscaling", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Framework :: AsyncIO",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/synaptiai/cronoq"
Documentation = "https://synaptiai.github.io/cronoq/"
Source = "https://github.com/synaptiai/cronoq"
Issues = "https://github.com/synaptiai/cronoq/issues"
Changelog = "https://github.com/synaptiai/cronoq/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# gRPC client and remote worker for cronoq-server (`cronoq.client`). The generated stubs need
# runtimes at least as new as the generator (see scripts/gen_proto.sh).
client = ["grpcio>=1.75.1", "protobuf>=5.27.2,<8"]
test = ["cronoq[client]", "pytest>=8.4", "pytest-asyncio>=1.2", "mypy>=1.18"]

[tool.maturin]
python-source = "python"
module-name = "cronoq._cronoq"
features = ["extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["python/tests"]
