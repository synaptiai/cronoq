[package]
name = "cronoq-core"
description = "Sans-IO core engine of the cronoq elastic priority scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cronoq-core"
readme = "README.md"
keywords = ["scheduler", "priority-queue", "sans-io", "deadline", "simulation"]
categories = ["algorithms", "concurrency", "data-structures"]

[dependencies]
rustc-hash.workspace = true
smallvec.workspace = true
croner = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }

[features]
default = ["cron", "tz"]
# Recurring schedules (cron expressions). Without it `Core::add_recurring` returns an error.
cron = ["dep:croner", "dep:chrono"]
# The IANA time-zone database for schedules. Without it schedules run in UTC only. This
# data is most of the compiled size of the crate.
tz = ["cron", "dep:chrono-tz"]

[dev-dependencies]
proptest.workspace = true
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "core"
harness = false
