[package]
name = "cronoq-store-postgres"
description = "PostgreSQL store for cronoq: durable state, leader election and fencing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cronoq = { path = "../cronoq", version = "0.1.0", default-features = false }
cronoq-core.workspace = true
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.47", features = ["full"] }
