// cronoq server API (v1).
//
// Times are either relative seconds (`*_in_s`, `*_s`) or absolute Unix nanoseconds
// (`*_unix_ns`). Authentication: `authorization: Bearer <token>` metadata (or a client
// certificate mapped to a role when mTLS is configured). Roles: client (Tasks), worker
// (Workers), metrics (Admin.Snapshot), admin (everything).
//
// Errors use gRPC status codes:
//   INVALID_ARGUMENT     malformed request or spec
//   NOT_FOUND            unknown task, pool, resource or dependency
//   FAILED_PRECONDITION  fixed-start reservation conflict, wrong pool kind
//   RESOURCE_EXHAUSTED   queue bounds reached (retry later)
//   DEADLINE_EXCEEDED    a wait timed out while the task is still running
//   UNAVAILABLE          not the leader, or shutting down (retry against the leader)
//   UNAUTHENTICATED / PERMISSION_DENIED
syntax = "proto3";

package cronoq.v1;

enum Priority {
  PRIORITY_UNSPECIFIED = 0; // treated as NORMAL
  PRIORITY_CRITICAL = 1;
  PRIORITY_HIGH = 2;
  PRIORITY_NORMAL = 3;
  PRIORITY_LOW = 4;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_BLOCKED = 1;
  TASK_STATUS_SCHEDULED = 2;
  TASK_STATUS_READY = 3;
  TASK_STATUS_RUNNING = 4;
  TASK_STATUS_RETRYING = 5;
  TASK_STATUS_SUCCEEDED = 6;
  TASK_STATUS_FAILED = 7;
  TASK_STATUS_DEAD_LETTERED = 8;
  TASK_STATUS_CANCELLED = 9;
  TASK_STATUS_SKIPPED = 10;
  TASK_STATUS_MISSED = 11;
  TASK_STATUS_SHED = 12;
}

enum EdgeCond {
  EDGE_COND_UNSPECIFIED = 0; // treated as ON_SUCCESS
  EDGE_COND_ON_SUCCESS = 1;
  EDGE_COND_ON_COMPLETE = 2;
  EDGE_COND_ON_FAILURE = 3;
}

enum MissPolicy {
  MISS_POLICY_UNSPECIFIED = 0; // treated as RUN_LATE
  MISS_POLICY_RUN_LATE = 1;
  MISS_POLICY_SKIP = 2;
  MISS_POLICY_FAIL = 3;
}

message TaskRef {
  oneof target {
    uint64 id = 1;
    string key = 2;
  }
}

message Dep {
  TaskRef target = 1;
  EdgeCond cond = 2;
}

message RetryPolicy {
  uint32 max_attempts = 1;
  double initial_backoff_s = 2;
  double multiplier = 3;
  double max_backoff_s = 4;
  bool jitter = 5;
}

message TaskSpec {
  bytes payload = 1;
  string content_type = 2;
  string kind = 3;          // default "default"
  string pool = 4;          // default "default"
  Priority priority = 5;
  string key = 6;           // optional unique key
  optional double deadline_in_s = 7;
  optional int64 deadline_unix_ns = 8;
  optional double start_in_s = 9;
  optional int64 start_unix_ns = 10;
  optional double tolerance_s = 11; // default 1s
  MissPolicy on_miss = 12;
  optional double duration_hint_s = 13;
  optional double timeout_s = 14;
  RetryPolicy retry = 15;   // unset = pool default
  repeated Dep deps = 16;
  map<string, uint32> resources = 17;
  map<string, string> tags = 18;
  // Worker labels this task requires: it runs only on workers that registered with all of them.
  map<string, string> labels = 19;
  // Tenant, for pools that share capacity fairly between tenants.
  string tenant = 20;
}

message SubmitRequest {
  TaskSpec task = 1;
  // Block until the task finishes and return its result.
  bool wait = 2;
  // Upper bound for `wait` (capped by the server's `limits.max_wait_s`).
  optional double wait_timeout_s = 3;
}

message SubmitResponse {
  uint64 id = 1;
  bool duplicate = 2;
  TaskResult result = 3; // set when wait = true
}

message SubmitBatchRequest {
  repeated TaskSpec tasks = 1; // admitted atomically; may reference each other's keys
}

message SubmitBatchResponse {
  repeated SubmitResponse tasks = 1;
}

message CancelRequest {
  TaskRef task = 1;
}

message CancelResponse {
  bool cancelled = 1;
}

message GetRequest {
  TaskRef task = 1;
}

// Task details. Fields other than id and status are best effort: they are known for tasks
// submitted or observed by the serving leader (and for persisted tasks with a durable store,
// Postgres or SQLite).
message TaskInfo {
  uint64 id = 1;
  TaskStatus status = 2;
  string pool = 3;
  string key = 4;
  string kind = 5;
  uint32 attempt = 6;
  uint32 max_attempts = 7;          // 0 if unknown
  optional int64 created_unix_ns = 8;
  optional int64 started_unix_ns = 9;
  optional int64 finished_unix_ns = 10;
  string message = 11;              // last error or status message
  bool output_available = 12;
  string tenant = 13;
  Priority priority = 14;           // UNSPECIFIED if unknown
}

// Tasks in id order (newest last). Live tasks come from the engine; finished ones from the
// store, or from the server's bounded cache without one. A page is not an atomic snapshot: a
// task that finishes while the page is built can be missing from it.
message ListTasksRequest {
  repeated string pools = 1;        // empty = all pools the caller may see
  repeated TaskStatus statuses = 2; // empty = any
  uint64 after = 3;                 // only ids above this; 0 = from the start
  uint32 limit = 4;                 // 0 = 100; at most the server's `limits.max_list`
}

message ListTasksResponse {
  repeated TaskInfo tasks = 1;
  // Pass as `after` for the next page; 0 when this page is the last.
  uint64 next_after = 2;
  // Shards that could not be reached; their part is missing from this response.
  repeated string unavailable_shards = 3;
}

message TaskResult {
  uint64 id = 1;
  TaskStatus status = 2;            // always terminal
  optional bytes output = 3;
  string message = 4;
  // False for a succeeded task whose output is no longer retained.
  bool output_available = 5;
}

message WaitRequest {
  TaskRef task = 1;
  optional double timeout_s = 2;    // capped by the server's `limits.max_wait_s`
}

message WatchRequest {
  repeated string pools = 1;        // empty = all pools the caller may see
  repeated uint64 ids = 2;          // optional task id filter
  repeated string keys = 3;         // optional task key filter
  // Every transition (blocked, ready, running, ...), not only terminal statuses.
  bool all_transitions = 4;
}

message StatusEvent {
  uint64 id = 1;
  string pool = 2;
  string key = 3;
  TaskStatus status = 4;
  uint32 attempt = 5;
  int64 at_unix_ns = 6;
  string message = 7;
}

service Tasks {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc SubmitBatch(SubmitBatchRequest) returns (SubmitBatchResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Get(GetRequest) returns (TaskInfo);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc Wait(WaitRequest) returns (TaskResult);
  // Ends with UNAVAILABLE when the server shuts down or loses leadership, and with
  // DATA_LOSS if the client falls too far behind.
  rpc Watch(WatchRequest) returns (stream StatusEvent);
}

// ---------------------------------------------------------------------------------------------
// Remote workers open one bidirectional stream, register for a pool with a number of slots,
// then receive leases and report heartbeats and outcomes.

// Protocol version spoken by this definition.
// 1: initial version.
// 2: Nack/Cancelled outcomes, Shutdown, lease metadata, Complete.content_type.
// 3: worker labels (Register.labels); lease ids carry the leader epoch. Servers refuse workers
//    that speak an older version.

message Register {
  string pool = 1;
  uint32 slots = 2;
  string worker_name = 3;
  uint32 protocol_version = 4;      // 0 is treated as 1
  // Labels of this worker; tasks that require labels are leased only to matching workers.
  map<string, string> labels = 5;
}

message Heartbeat {
  uint64 lease = 1;
}

message Complete {
  uint64 lease = 1;
  bytes output = 2;
  string content_type = 3;
}

message Fail {
  uint64 lease = 1;
  string message = 2;
  bool permanent = 3;
  optional double retry_after_s = 4;
}

message SetSlots {
  uint32 slots = 1;
}

// The worker cannot take this lease (e.g. it is draining); the server offers it to another
// worker without counting an attempt when possible.
message Nack {
  uint64 lease = 1;
  string reason = 2;
}

// The handler observed cancellation of this lease.
message Cancelled {
  uint64 lease = 1;
}

message WorkerMessage {
  oneof msg {
    Register register = 1;
    Heartbeat heartbeat = 2;
    Complete complete = 3;
    Fail fail = 4;
    SetSlots set_slots = 5;
    Nack nack = 6;
    Cancelled cancelled = 7;
  }
}

message Registered {
  uint64 worker_id = 1;
  optional double lease_ttl_s = 2;  // heartbeat at least this often (per lease)
  uint32 slots = 3;                 // slots granted (may be lower than requested)
  uint32 protocol_version = 4;
  uint64 max_message_bytes = 5;     // largest message the server accepts
}

message Lease {
  uint64 lease = 1;
  uint64 task_id = 2;
  uint32 attempt = 3;
  bytes payload = 4;
  string content_type = 5;
  string kind = 6;
  string key = 7;
  map<string, string> tags = 8;
  optional double timeout_s = 9;
  optional int64 deadline_unix_ns = 10;
  string pool = 11;
  Priority priority = 12;
  optional double lease_ttl_s = 13;
}

message Abort {
  uint64 lease = 1;
  string reason = 2;
}

// The server is going away: finish or abandon running leases and reconnect (with backoff).
message Shutdown {
  string reason = 1;
  bool not_leader = 2;
}

message ServerMessage {
  oneof msg {
    Registered registered = 1;
    Lease lease = 2;
    Abort abort = 3;
    Shutdown shutdown = 4;
  }
}

service Workers {
  rpc Work(stream WorkerMessage) returns (stream ServerMessage);
}

// ---------------------------------------------------------------------------------------------

message Empty {}

message PoolSnapshot {
  string name = 1;
  uint32 capacity = 2;
  uint32 busy = 3;
  uint32 held = 4;
  uint32 desired = 5;
  repeated uint64 pending_by_class = 6; // critical, high, normal, low
  uint64 reservations = 7;
  uint64 dispatched = 8;
  uint64 succeeded = 9;
  uint64 failed = 10;
  double priority_adherence = 11;
  double fixed_start_hit_rate = 12;
  double utilization = 13;
  double schedule_efficiency = 14;
  double wait_p50_s = 15;
  double wait_p90_s = 16;
  double wait_p99_s = 17;
  double cost = 18;
  uint64 workers_connected = 19;
  // Worker groups (workers with the same labels), unlabeled first.
  repeated WorkerGroup groups = 20;
}

message WorkerGroup {
  map<string, string> labels = 1;
  uint32 capacity = 2;
  uint32 busy = 3;
}

message Totals {
  uint64 submitted = 1;
  uint64 dispatched = 2;
  uint64 succeeded = 3;
  uint64 failed = 4;
  uint64 dead_lettered = 5;
  uint64 cancelled = 6;
  uint64 skipped = 7;
  uint64 missed = 8;
  uint64 shed = 9;
  uint64 retries = 10;
  uint64 timeouts = 11;
  uint64 lease_expiries = 12;
  // Completions and failures reported for leases that were no longer valid (late, duplicate,
  // or from an earlier leader); they were ignored.
  uint64 stale_completions = 13;
}

message SnapshotResponse {
  repeated PoolSnapshot pools = 1;
  uint64 live_tasks = 2;
  uint64 running = 3;
  uint64 pending = 4;
  Totals totals = 5;
  uint64 workers_connected = 6;
  // Shards that could not be reached; their part is missing from this response.
  repeated string unavailable_shards = 7;
}

// What a recurring occurrence does while the previous one is still live.
enum Overlap {
  OVERLAP_UNSPECIFIED = 0; // skip
  OVERLAP_SKIP = 1;
  OVERLAP_ALLOW = 2;
  // Wait for the previous occurrence to finish, whatever its outcome.
  OVERLAP_QUEUE = 3;
  // Wait for the previous occurrence and run only if it succeeded; otherwise skip this and the
  // following occurrences until the schedule is added again.
  OVERLAP_QUEUE_ON_SUCCESS = 4;
}

// A cron schedule. The template's `deadline_in_s` is relative to each occurrence's start, its
// `key` is a prefix (each occurrence's key is `<key>@<start in UTC, RFC 3339>`), and its
// `tolerance_s` and `on_miss` apply to each occurrence. Absolute deadlines, start times and
// dependencies are rejected.
message RecurringRequest {
  string name = 1;
  string cron = 2;
  string tz = 3;
  TaskSpec template = 4;
  reserved 5;
  Overlap overlap = 6;
}

message RemoveRecurringRequest {
  string name = 1;
}

message RemoveRecurringResponse {
  bool removed = 1;
}

// A connected remote worker.
message WorkerInfo {
  uint64 id = 1;                    // assigned by this server for the connection
  string name = 2;                  // as the worker registered
  string pool = 3;
  map<string, string> labels = 4;
  uint32 slots = 5;
  uint32 busy = 6;
  int64 connected_unix_ns = 7;
}

message ListWorkersResponse {
  repeated WorkerInfo workers = 1;
  // Shards that could not be reached; their part is missing from this response.
  repeated string unavailable_shards = 2;
}

message RecurringInfo {
  string name = 1;
  string cron = 2;
  string tz = 3;                    // empty = UTC
  string pool = 4;
  string kind = 5;
  Overlap overlap = 6;
  optional int64 next_unix_ns = 7;  // unset when the schedule has no further occurrence
  optional uint64 last_task_id = 8; // the latest occurrence's task
}

message ListRecurringResponse {
  repeated RecurringInfo schedules = 1;
  // Shards that could not be reached; their part is missing from this response.
  repeated string unavailable_shards = 2;
}

service Admin {
  rpc Snapshot(Empty) returns (SnapshotResponse);
  rpc AddRecurring(RecurringRequest) returns (Empty);
  rpc RemoveRecurring(RemoveRecurringRequest) returns (RemoveRecurringResponse);
  // Both need the metrics role and list only what the caller's pools allow.
  rpc ListWorkers(Empty) returns (ListWorkersResponse);
  rpc ListRecurring(Empty) returns (ListRecurringResponse);
}
