[workspace]
resolver = "3"
members = [
    "crates/cronoq-core",
    "crates/cronoq",
    "crates/cronoq-proto",
    "crates/cronoq-server",
    "crates/cronoq-store-postgres",
    "crates/cronoq-store-tests",
    "crates/cronoq-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/synaptiai/cronoq"
homepage = "https://synaptiai.github.io/cronoq/"
authors = ["Daniel Bentes <daniel.bentes@synapti.ai>"]

[workspace.dependencies]
cronoq-core = { path = "crates/cronoq-core", version = "0.1.0" }
rustc-hash = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
croner = "4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
