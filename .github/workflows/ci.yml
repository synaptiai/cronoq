name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run on main catches breakage from new toolchains and dependency releases.
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cronoq-py (abi3-py314) needs a Python 3.14+ interpreter to build.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p cronoq --no-default-features --all-targets
      # Embedded builds leave out cron, time-zone data and the multi-threaded runtime.
      - run: cargo clippy -p cronoq-core --no-default-features --all-targets
      - run: cargo clippy -p cronoq-core --no-default-features --features cron --all-targets
      - run: cargo clippy -p cronoq-ffi --features sqlite --all-targets
      - name: Rustdoc (no broken links, no missing docs)
        run: cargo doc --workspace --no-deps --exclude cronoq-py
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cronoq-py (abi3-py314) needs a Python 3.14+ interpreter to build.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --workspace

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cronoq-py (abi3-py314) needs a Python 3.14+ interpreter to build.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # PostgreSQL 16 binaries are preinstalled on ubuntu-24.04; the store and HA tests start
      # throwaway servers from /usr/lib/postgresql/16/bin.
      - run: ls /usr/lib/postgresql/16/bin/initdb
      - run: cargo test --workspace
      - name: Feature sets of the core (no cron, cron without time zones)
        run: |
          cargo test -p cronoq-core --no-default-features --test features
          cargo test -p cronoq-core --no-default-features --features cron --test features
      - name: Blocking scheduler on the single-threaded runtime
        run: cargo test -p cronoq --no-default-features --test review --test runtime blocking
      - name: C API with the SQLite store
        run: cargo test -p cronoq-ffi --features sqlite
      - name: Deterministic simulation (more seeds)
        run: cargo test --release -p cronoq-core --test sim
        env:
          CRONOQ_SIM_SEEDS: "500"

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Crates package and build from their published contents
        run: cargo publish --workspace --dry-run

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.14", "3.15"]
    env:
      CRONOQ_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build and test (editable)
        shell: bash
        working-directory: crates/cronoq-py
        run: |
          python -m venv .venv
          if [ -f .venv/bin/activate ]; then . .venv/bin/activate; else . .venv/Scripts/activate; fi
          pip install -r ../../.github/requirements/ci.txt
          maturin develop
          pytest -q python/tests
      - name: Type checks (stubs match the extension; package type-checks)
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        shell: bash
        working-directory: crates/cronoq-py
        run: |
          . .venv/bin/activate
          python -m mypy.stubtest cronoq._cronoq
          python -m mypy --ignore-missing-imports python/cronoq

  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CRONOQ_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sdks/go/go.sum
      - run: cargo build -p cronoq-server
      - name: Generated code matches the protocol
        if: matrix.os == 'ubuntu-24.04'
        working-directory: sdks/go
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf generate
          git diff --exit-code -- cronoqpb
      - name: Vet and test against a real server
        working-directory: sdks/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Known vulnerabilities
        if: matrix.os == 'ubuntu-24.04'
        working-directory: sdks/go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The embeddable C library: its own tests, the C example, the Go wrapper in both build
  # modes and, on macOS, the Swift package. The libraries are kept as artifacts so that they
  # can be tried without a Rust toolchain.
  embed:
    name: embed (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            dylib: libcronoq_ffi.so
            cc: cc
            libs: -lpthread -ldl -lm
          - os: macos-15
            target: aarch64-apple-darwin
            dylib: libcronoq_ffi.dylib
            cc: cc
            libs: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            dylib: libcronoq_ffi.dylib
            cc: cc
            libs: ""
          # cgo links with the GNU toolchain on Windows, so the library is built for it.
          - os: windows-2022
            target: x86_64-pc-windows-gnu
            dylib: cronoq_ffi.dll
            cc: gcc
            libs: -lkernel32 -lntdll -luserenv -lws2_32 -ldbghelp -lsynchronization
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: embed-${{ matrix.target }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sdks/go-embed/go.sum
      - name: Tests of the C API
        run: cargo test -p cronoq-ffi --target ${{ matrix.target }}
      - name: Build the libraries
        run: |
          cargo build --release -p cronoq-ffi --target ${{ matrix.target }}
          mkdir -p out/static
          cp target/${{ matrix.target }}/release/${{ matrix.dylib }} out/
          cp target/${{ matrix.target }}/release/libcronoq_ffi.a out/static/
          cp crates/cronoq-ffi/include/cronoq.h out/
      - name: The header is generated from the source
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cargo install cbindgen --locked --version 0.29.4
          cd crates/cronoq-ffi
          cbindgen --config cbindgen.toml --crate cronoq-ffi --output include/cronoq.h
          git diff --exit-code -- include/cronoq.h
          cmp include/cronoq.h ../../sdks/go-embed/include/cronoq.h
          cmp include/cronoq.h ../../sdks/swift/Sources/CCronoq/include/cronoq.h
      - name: C example
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Werror -I crates/cronoq-ffi/include \
            crates/cronoq-ffi/examples/c/example.c out/static/libcronoq_ffi.a \
            ${{ matrix.libs }} -o out/example
          ./out/example
          rm out/example*
      - name: Go, loading the dynamic library without cgo
        working-directory: sdks/go-embed
        env:
          CGO_ENABLED: "0"
        run: |
          root=$(cd ../.. && (pwd -W 2>/dev/null || pwd))
          export CRONOQ_LIBRARY="$root/out/${{ matrix.dylib }}"
          # The Windows checkout has CRLF line endings, which gofmt reports.
          if [ "$RUNNER_OS" != "Windows" ]; then test -z "$(gofmt -l .)"; fi
          go vet ./...
          go test -count=1 ./...
          go run ./example
      - name: Go, linking the static library with cgo
        working-directory: sdks/go-embed
        env:
          CGO_ENABLED: "1"
        run: |
          root=$(cd ../.. && (pwd -W 2>/dev/null || pwd))
          export CGO_LDFLAGS="-L$root/out/static"
          go vet -tags cronoq_static ./...
          go test -tags cronoq_static -count=1 ./...
          go run -tags cronoq_static ./example
      - name: Swift package
        if: startsWith(matrix.os, 'macos')
        working-directory: sdks/swift
        run: |
          swift test -Xlinker -L"$GITHUB_WORKSPACE/out/static"
          swift run -Xlinker -L"$GITHUB_WORKSPACE/out/static" cronoq-example
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cronoq-embed-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  typescript:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      CRONOQ_REQUIRE_SERVER: "1"
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: cargo build -p cronoq-server
        working-directory: .
      - run: npm ci
      - name: Generated code matches the protocol
        if: matrix.node == '24'
        run: npm run check:generated
      - name: Type-check, build and test against a real server
        run: npm test
      - name: Browser client over gRPC-Web (headless Chromium)
        if: matrix.node == '24'
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Known vulnerabilities in runtime dependencies
        if: matrix.node == '24'
        run: npm audit --omit=dev --audit-level=moderate

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: deploy/helm/test/e2e/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: cargo build --release -p cronoq-server -p cronoq-cli -p cronoq-operator
      - name: The operator chart's CRD matches the operator
        run: |
          target/release/cronoq-operator --print-crd > "$RUNNER_TEMP/crd.yaml"
          diff -u deploy/helm/cronoq-operator/crds/cronoqworkerscalers.yaml "$RUNNER_TEMP/crd.yaml"
      - name: Lint and render the charts; check every rendered configuration
        run: deploy/helm/test/template.sh
        env:
          CRONOQ_SERVER_BIN: target/release/cronoq-server
      - name: Build the test images
        run: |
          mkdir -p "$RUNNER_TEMP/server" "$RUNNER_TEMP/e2e"
          cp target/release/cronoq-server target/release/cronoq "$RUNNER_TEMP/server/"
          docker build -t cronoq-server:e2e -f deploy/helm/test/Dockerfile.server "$RUNNER_TEMP/server"
          (cd deploy/helm/test/e2e && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/e2e/e2e" .)
          docker build -t cronoq-e2e:e2e -f deploy/helm/test/Dockerfile.e2e "$RUNNER_TEMP/e2e"
          mkdir -p "$RUNNER_TEMP/operator"
          cp target/release/cronoq-operator "$RUNNER_TEMP/operator/"
          docker build -t cronoq-operator:e2e -f deploy/helm/test/Dockerfile.operator "$RUNNER_TEMP/operator"
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: cronoq
      - name: High availability, failover, upgrade, shards and the operator on kind
        run: |
          kind load docker-image cronoq-server:e2e cronoq-e2e:e2e cronoq-operator:e2e --name cronoq
          deploy/helm/test/e2e.sh

  # Build a real wheel on each platform and test it installed into a clean environment, outside
  # the source tree, exactly as users get it from PyPI.
  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15-intel # Intel
          - os: macos-15 # Apple silicon
          - os: windows-2022
    env:
      CRONOQ_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: crates/cronoq-py
          args: --release --out dist
          manylinux: auto
      - name: Build the server for client tests
        run: cargo build -p cronoq-server
      - name: Install wheel in a clean venv and run the tests from a copy
        shell: bash
        run: bash .github/scripts/test_wheel.sh crates/cronoq-py/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: crates/cronoq-py/dist

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
