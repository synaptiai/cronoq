name: Apple

# The embedded library (crates/cronoq-ffi) on Apple platforms: builds for iOS, the iOS
# simulator and macOS, a size report, the binary framework for the Swift package, and the
# tests on the iOS simulator. macOS runners are slow and costly, so this runs nightly, for a
# release, and on pull requests that change the embedded library, the Swift package or this
# workflow; not on every pull request.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/apple.yml
      - .github/scripts/apple_sizes.sh
      - .github/scripts/apple_xcframework.sh
      - .github/scripts/ios-sim-runner.sh
      # What the Apple builds are made of: a change here can break them.
      - crates/cronoq-ffi/**
      - crates/cronoq/src/clock.rs
      - sdks/swift/**

permissions:
  contents: read

# Called from the release workflow, `github.workflow` is the caller's name: a release and a
# nightly run on the same branch do not cancel each other.
concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  TARGETS: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin

jobs:
  # A green build per target, and the stripped size with and without cron and time zones.
  sizes:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ env.TARGETS }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: apple-sizes
      - name: Build every target and measure
        run: |
          .github/scripts/apple_sizes.sh > cronoq-embed-apple-sizes.md
          cat cronoq-embed-apple-sizes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-sizes
          path: cronoq-embed-apple-sizes.md
          if-no-files-found: error

  # The binary frameworks that the Swift package can use in place of a library built locally:
  # the static library for iOS, the iOS simulator and macOS (both architectures in one), in
  # two variants: without a store, and with the SQLite store.
  xcframework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ env.TARGETS }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: apple-xcframework
      - name: Framework without a store
        run: .github/scripts/apple_xcframework.sh CCronoq
      - name: Framework with the SQLite store
        run: .github/scripts/apple_xcframework.sh CCronoq-sqlite --features sqlite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-xcframework
          path: |
            CCronoq.xcframework.zip
            CCronoq.xcframework.zip.checksum
            CCronoq-sqlite.xcframework.zip
            CCronoq-sqlite.xcframework.zip.checksum
          if-no-files-found: error

  # The engine's deterministic simulation and the tests of the C API, inside the simulator.
  ios-simulator:
    runs-on: macos-15
    env:
      CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER: ${{ github.workspace }}/.github/scripts/ios-sim-runner.sh
      # simctl hands variables with this prefix to the program it starts.
      SIMCTL_CHILD_CRONOQ_SIM_SEEDS: "200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: apple-ios-simulator
      - name: Boot a simulator
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              # com.apple.CoreSimulator.SimRuntime.iOS-18-2 -> (18, 2)
              return tuple(int(n) for n in runtime.rsplit("iOS-", 1)[-1].split("-") if n.isdigit())
          phones = [d for runtime, ds in sorted(devices.items(), key=lambda kv: version(kv[0]))
                    if "iOS" in runtime for d in ds if "iPhone" in d["name"]]
          if not phones:
              sys.exit("no iPhone simulator is available on this runner")
          print(phones[-1]["udid"])')
          test -n "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device"
      - name: Deterministic simulation of the engine
        run: cargo test --release -p cronoq-core --target aarch64-apple-ios-sim --test sim
      - name: Tests of the C API
        run: cargo test --release -p cronoq-ffi --target aarch64-apple-ios-sim
      - name: Clock tests of the driver
        run: cargo test --release -p cronoq --no-default-features --target aarch64-apple-ios-sim --test clock
