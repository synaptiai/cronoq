name: Docs

# Builds the documentation book on every pull request and deploys it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "CHANGELOG.md", "crates/*/README.md", "sdks/*/README.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "CHANGELOG.md", "crates/*/README.md", "sdks/*/README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.4.52"
  MDBOOK_SHA256: "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdBook (pinned and checksum-verified)
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o mdbook.tgz
          echo "${MDBOOK_SHA256}  mdbook.tgz" | sha256sum -c -
          tar xzf mdbook.tgz -C /usr/local/bin mdbook
      - name: Check internal links
        run: python3 .github/scripts/check_doc_links.py docs/book/src README.md CONTRIBUTING.md SECURITY.md RELEASING.md crates/cronoq-py/README.md sdks/go/README.md sdks/typescript/README.md
      - name: Build the book (warnings are errors)
        run: |
          mdbook build docs/book 2>&1 | tee build.log
          ! grep -E "\[(WARN|ERROR)\]" build.log
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/book/book

  # Deploys only once GitHub Pages is enabled (Settings → Pages → Source: GitHub Actions) and
  # the repository variable DEPLOY_DOCS is set to "true".
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_DOCS == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
