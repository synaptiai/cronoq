name: Docs

# Builds the documentation book on every pull request and deploys it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "CHANGELOG.md", "crates/*/README.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "CHANGELOG.md", "crates/*/README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.4.52"
  MDBOOK_SHA256: "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mdBook (pinned and checksum-verified)
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o mdbook.tgz
          echo "${MDBOOK_SHA256}  mdbook.tgz" | sha256sum -c -
          tar xzf mdbook.tgz -C /usr/local/bin mdbook
      - name: Check internal links
        run: python3 .github/scripts/check_doc_links.py docs/book/src README.md CONTRIBUTING.md SECURITY.md RELEASING.md crates/cronoq-py/README.md
      - name: Build the book (warnings are errors)
        run: |
          mdbook build docs/book 2>&1 | tee build.log
          ! grep -E "\[(WARN|ERROR)\]" build.log
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/book/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
