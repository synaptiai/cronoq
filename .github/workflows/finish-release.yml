name: Finish release
# Completes a tagged release whose run published only part of it, from that run's own build
# outputs: re-running a job of the run uses the workflow file of the tagged commit, so a fix to a
# publish step can't reach it.
#   - publishes the run's TypeScript package to GitHub Packages, unless that version is there;
#   - creates the GitHub release with the run's files, once every crate of the tag is on
#     crates.io.
# Re-run the run's failed crates job first (it skips published versions). RELEASING.md describes
# when to use this.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, such as v0.2.0"
        required: true
      run_id:
        description: "Id of the Release run that the tag's push started"
        required: true

permissions: {}

concurrency:
  group: finish-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.run.outputs.sha }}
    steps:
      - name: Check that the run is the tag's Release run, and its build jobs passed
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "not a run id: $RUN_ID"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            -q '[.path, .event, .head_branch, .head_sha] | join(" ")')
          want=".github/workflows/release.yml push $TAG $sha"
          test "$run" = "$want" || { echo "run $RUN_ID is \"$run\", expected \"$want\""; exit 1; }
          failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            -q '.jobs[] | select((.name | test("^(verify|wheels|sdist|test-wheels|server-binaries|npm-package|container|charts)")) and .conclusion != "success") | .name')
          test -z "$failed" || { echo "jobs of run $RUN_ID that did not pass:"; echo "$failed"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@synaptiai"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the tarball against the tag, and whether it is already published
        id: tarball
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(npm/*.tgz)
          test "${#tarballs[@]}" -eq 1 || { echo "expected one npm tarball, found ${#tarballs[@]}"; exit 1; }
          meta=$(tar -xOzf "${tarballs[0]}" package/package.json)
          name=$(node -p 'JSON.parse(require("fs").readFileSync(0)).name' <<<"$meta")
          version=$(node -p 'JSON.parse(require("fs").readFileSync(0)).version' <<<"$meta")
          test "$version" = "${TAG#v}" || { echo "the tarball is version $version, the tag is $TAG"; exit 1; }
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tarball.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: npm/*.tgz
      - if: steps.tarball.outputs.publish == 'true'
        run: npm publish ./npm/*.tgz

  github-release:
    needs: [check, publish-npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check that every crate of the tag is on crates.io
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          missing=0
          for crate in $(cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.publish != []) | .name'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "cronoq-release (github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$code" = 200 ]; then echo "$crate $version: published"; else echo "$crate $version: missing ($code)"; missing=1; fi
          done
          test "$missing" = 0 || { echo "re-run the Release run's publish-crates job first"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          body_path: notes.md
          files: |
            artifacts/cronoq-server-*
            artifacts/*.whl
            artifacts/cronoq-[0-9]*.tgz
            artifacts/cronoq-operator-[0-9]*.tgz
            artifacts/synaptiai-cronoq-[0-9]*.tgz
            artifacts/*.tar.gz
