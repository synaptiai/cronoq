name: Release

# Push a tag `vX.Y.Z` (matching the workspace version) to publish:
#   - Python wheels and sdist to PyPI (trusted publishing, environment `pypi`)
#   - crates to crates.io (trusted publishing, environment `crates-io`)
#   - cronoq-server binaries and wheels to a GitHub release
#   - multi-arch container images to ghcr.io/<owner>/cronoq and ghcr.io/<owner>/cronoq-operator
#   - the TypeScript SDK to npm as `cronoq` (environment `npm`, with provenance)
#   - the Helm charts to oci://ghcr.io/<owner>/charts
# Before the first release, set up the registries as RELEASING.md describes. A dry run builds,
# tests and packages everything and publishes nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test everything but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false) }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cronoq-py (abi3-py314) needs a Python 3.14+ interpreter to build.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Any run on a tag checks the versions, including a manual run that publishes.
      - name: Tag matches workspace and package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ws=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="cronoq"))')
          test "$tag" = "$ws" || { echo "tag $tag != crate version $ws"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$tag] section"; exit 1; }
          npm=$(python3 -c 'import json; print(json.load(open("sdks/typescript/package.json"))["version"])')
          test "$tag" = "$npm" || { echo "tag $tag != sdks/typescript/package.json version $npm"; exit 1; }
          for chart in deploy/helm/cronoq deploy/helm/cronoq-operator; do
            grep -qx "version: $tag" "$chart/Chart.yaml" || { echo "$chart: version is not $tag"; exit 1; }
            grep -qx "appVersion: \"$tag\"" "$chart/Chart.yaml" || { echo "$chart: appVersion is not $tag"; exit 1; }
          done
      - run: cargo test --workspace
      - run: cargo publish --workspace --dry-run

  wheels:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04, target: aarch64, manylinux: auto }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-14, target: aarch64 }
          - { os: windows-2022, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: crates/cronoq-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/cronoq-py/dist

  sdist:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: crates/cronoq-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: crates/cronoq-py/dist

  test-wheels:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, artifact: wheels-ubuntu-24.04-x86_64, python: "3.14" }
          - { os: ubuntu-24.04, artifact: wheels-ubuntu-24.04-x86_64, python: "3.15" }
          - { os: macos-15-intel, artifact: wheels-macos-15-intel-x86_64, python: "3.14" }
          - { os: macos-14, artifact: wheels-macos-14-aarch64, python: "3.14" }
          - { os: macos-14, artifact: wheels-macos-14-aarch64, python: "3.15" }
          - { os: windows-2022, artifact: wheels-windows-2022-x64, python: "3.14" }
          - { os: windows-2022, artifact: wheels-windows-2022-x64, python: "3.15" }
    env:
      CRONOQ_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo build --locked -p cronoq-server
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - shell: bash
        run: bash .github/scripts/test_wheel.sh dist

  server-binaries:
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p cronoq-server -p cronoq-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="cronoq-server-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE-MIT LICENSE-APACHE README.md deploy/cronoq.example.toml "$name/"
          if [ -f "target/${{ matrix.target }}/release/cronoq-server.exe" ]; then
            cp "target/${{ matrix.target }}/release/cronoq-server.exe" "target/${{ matrix.target }}/release/cronoq.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/cronoq-server" "target/${{ matrix.target }}/release/cronoq" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: cronoq-server-*.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.target }}
          path: cronoq-server-*.*

  publish-pypi:
    needs: [test-wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist

  publish-crates:
    needs: [verify, test-wheels]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      id-token: write
    env:
      # crates.io trusted publishing can only be configured for crates that already exist, so the
      # first release uses an API token stored as the environment secret CARGO_REGISTRY_TOKEN.
      # Delete the secret once trusted publishing is configured (see RELEASING.md).
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        if: env.BOOTSTRAP_TOKEN == ''
        id: auth
      # Publishes in dependency order; crates with `publish = false` are skipped.
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.BOOTSTRAP_TOKEN }}

  container:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: cronoq
            dockerfile: Dockerfile
          - image: cronoq-operator
            dockerfile: Dockerfile.operator
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  npm-package:
    needs: verify
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      # Builds through `prepack`; the tarball is what `npm publish` uploads. It is renamed so that
      # it cannot collide with the server chart's cronoq-X.Y.Z.tgz in the release assets.
      - run: |
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          for f in "$RUNNER_TEMP"/npm/cronoq-*.tgz; do mv "$f" "$RUNNER_TEMP/npm/npm-$(basename "$f")"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/*.tgz

  publish-npm:
    needs: [npm-package, test-wheels]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      # npm trusted publishing can only be configured for a package that exists, so the first
      # release uses a token stored as the environment secret NPM_TOKEN. Delete the secret once
      # trusted publishing is configured (see RELEASING.md).
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm
      - name: Refuse a tarball that does not match the tag, or a version already on npm
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(tar -xOzf npm/*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          test "$version" = "$tag" || { echo "the tarball is version $version, the tag is $tag"; exit 1; }
          if npm view "cronoq@$version" version >/dev/null 2>&1; then
            echo "cronoq@$version is already on npm"; exit 1
          fi
      - run: npm publish npm/*.tgz --access public --provenance

  charts:
    needs: [verify, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: helm package deploy/helm/cronoq deploy/helm/cronoq-operator --destination charts
      - name: Push to oci://ghcr.io/<owner>/charts
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          for c in charts/*.tgz; do helm push "$c" "oci://ghcr.io/${OWNER,,}/charts"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charts
          path: charts/*.tgz

  github-release:
    needs: [publish-pypi, publish-crates, publish-npm, server-binaries, container, charts]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: |
            artifacts/cronoq-server-*
            artifacts/*.whl
            artifacts/cronoq-[0-9]*.tgz
            artifacts/cronoq-operator-[0-9]*.tgz
            artifacts/*.tar.gz
