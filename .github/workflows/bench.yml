name: Benchmarks

# Wall-clock targets from SPEC §1, checked on a dedicated runner. Shared CI machines are too
# noisy for tight thresholds, so this gates on the absolute targets with headroom and records
# the criterion reports as artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo bench -p cronoq-core --bench core -- --noplot | tee core.txt
      - run: cargo bench -p cronoq --bench runtime -- --noplot | tee runtime.txt
      - name: Check targets
        run: python3 .github/scripts/check_bench.py core.txt runtime.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion
          path: target/criterion
