name: Benchmarks

# Wall-clock targets from SPEC §1, checked on a dedicated runner. Shared CI machines are too
# noisy for tight thresholds, so this gates on the absolute targets with headroom and records
# the criterion reports as artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo bench -p cronoq-core --bench core -- --noplot | tee core.txt
      - run: cargo bench -p cronoq --bench runtime -- --noplot | tee runtime.txt
      - name: Check targets
        run: python3 .github/scripts/check_bench.py core.txt runtime.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion
          path: target/criterion
