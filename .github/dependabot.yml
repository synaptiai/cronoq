version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /crates/cronoq-py
    schedule:
      interval: weekly

  # Pinned Python tooling used by CI.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    groups:
      ci-python:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
