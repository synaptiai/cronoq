[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "deny"

[bans]
multiple-versions = "warn"
# Every dependency must name a version (path dependencies inside the workspace excepted).
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # Bundled SQLite before 3.54.0 can return uninitialised memory when it opens a database with
    # a crafted `-wal` file. The fix needs libsqlite3-sys >= 0.39, and sqlx-sqlite 0.9.0 (the
    # latest release) requires < 0.38, so it cannot be selected yet. The SQLite store opens a path
    # the operator chooses. Remove this entry when sqlx releases the wider bound:
    # https://github.com/synaptiai/cronoq/issues/80
    { id = "RUSTSEC-2026-0459", reason = "no sqlx release accepts the patched libsqlite3-sys yet; see issue 80" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
